<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snickers Crunch - Crumble</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top bar -->
  <header class="bg-white border-bottom">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2 py-2">
      <div class="d-flex align-items-center">
        <a href="index.html">
          <img src="images/logo.png" alt="Crumble logo" width="60" class="me-3">
        </a>
        <div>
          <strong>Delivery to</strong>
          <div class="small text-muted">Upper Mall, Lahore - eta 35 minutes.</div>
        </div>
      </div>
      <div>
                <button class="btn btn-info me-2">🛒 Cart (0)</button>
        <button class="btn btn-outline-primary">Sign In / Register</button>
      </div>
    </div>
  </header>

    <!-- Product -->
  <main class="container my-4">

    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item active">Snickers Crunch</li>
      </ol>
    </nav>

    <div class="row g-4">

      <div class="col-12 col-md-6">
        <img src="images/snickers.jpg" alt="Snickers Crunch cookie" class="img-fluid rounded">
      </div>

      <div class="col-12 col-md-6">
        <h1>Snickers Crunch</h1>
        <p class="text-muted">A rich chocolate cookie loaded with peanuts, caramel and nougat, stacked with gooey Snickers pieces.</p>
        <h3><span class="badge bg-primary">Rs. 430.00</span></h3>
                <div class="d-flex align-items-center gap-3 mt-4">
          <div>
            <label for="quantity" class="form-label mb-1">Quantity</label>
            <input type="number" id="quantity" class="form-control" value="1" min="1" max="10" style="width: 90px;">
          </div>
          <button class="btn btn-info btn-lg mt-4">Add To Cart</button>
        </div>
      </div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
