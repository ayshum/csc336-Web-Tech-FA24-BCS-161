<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crumble</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

      <!-- Top bar -->
  <header class="bg-white border-bottom">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2 py-2">
      <div class="d-flex align-items-center">
        <img src="images/logo.png" alt="Crumble logo" width="60" class="me-3">
        <div>
          <strong>Delivery to</strong>
          <div class="small text-muted">Upper Mall, Lahore - eta 35 minutes.</div>
        </div>
      </div>
      <div>
        <button class="btn btn-info me-2">Cart (0)</button>
        <button class="btn btn-outline-primary">Sign In / Register</button>
      </div>
    </div>
  </header>

    <!-- Category navbar -->
  <nav class="navbar navbar-expand-md navbar-dark category-bar">
    <div class="container">
      <span class="navbar-brand d-md-none">Menu</span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#categoryMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="categoryMenu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="#monthly-drop">Monthly Drop</a></li>
          <li class="nav-item"><a class="nav-link" href="#crumble-cold">Crumble Cold</a></li>
          <li class="nav-item"><a class="nav-link" href="#crumble-pot">Crumble Pot</a></li>
          <li class="nav-item"><a class="nav-link" href="#cookies">Cookies</a></li>
          <li class="nav-item"><a class="nav-link" href="#shakes">Ice Cream Shakes</a></li>
        </ul>
      </div>
    </div>
  </nav>

    <!-- Banner -->
  <section>
    <img src="images/banner.jpg" alt="Smores cookie monthly drop" class="img-fluid w-100">
  </section>

    <!-- Main content -->
  <main class="container">

    <!-- Search box -->
    <input type="text" class="form-control my-3" placeholder="Search for">

  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
