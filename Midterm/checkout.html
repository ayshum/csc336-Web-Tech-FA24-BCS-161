<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Crumble</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="bg-white border-bottom">
    <div class="container py-2">
      <a href="index.html"><img src="images/logo.png" alt="Crumble logo" width="60"></a>
    </div>
  </header>

  <main class="container my-4">
    <h1 class="h3 mb-3">Checkout</h1>

    <form action="#" method="post">
      <div class="checkout-grid">

        <fieldset>
          <legend>Contact</legend>

          <div class="field">
            <label for="fullname">Full name</label>
            <input type="text" id="fullname" name="fullname" class="form-control"
                   required minlength="3" placeholder="Your name">
            <span class="error">Please enter your full name (3+ characters).</span>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control"
                   required placeholder="you@example.com">
            <span class="error">Enter a valid email address.</span>
          </div>

          <div class="field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" class="form-control"
                   required pattern="03[0-9]{2}-[0-9]{7}"
                   title="Format: 03XX-XXXXXXX" placeholder="0300-1234567">
            <span class="error">Use the format 03XX-XXXXXXX.</span>
          </div>
        </fieldset>

        <fieldset>
          <legend>Delivery</legend>

          <div class="field">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" class="form-control"
                   required placeholder="House, street, area">
            <span class="error">Address is required.</span>
          </div>

          <div class="field">
            <label for="city">City</label>
            <select id="city" name="city" class="form-select" required>
              <option value="">Select a city</option>
              <option>Lahore</option>
              <option>Islamabad</option>
              <option>Karachi</option>
              <option>Rawalpindi</option>
              <option>Faisalabad</option>
            </select>
            <span class="error">Please choose a city.</span>
          </div>

          <div class="field">
            <label for="date">Delivery date</label>
            <input type="date" id="date" name="date" class="form-control"
                   required min="2026-10-29" max="2026-12-29">
            <span class="error">Pick a date between 29 Oct 2026 and 29 Dec 2026.</span>
          </div>
        </fieldset>

      </div>

      <button type="submit" class="btn btn-info w-100 mt-3">Place Order</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
